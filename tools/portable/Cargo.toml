[package]
name = "markdownaura-portable"
version = "0.1.0"
edition = "2021"
publish = false
description = "Single-file launcher for MarkdownAura: unpacks the app and its WebView2 loader, then runs it"

# No dependencies on purpose. The only OS call is a MessageBox on failure, which is declared by hand —
# pulling in a bindings crate for one function would cost more than it saves.
[dependencies]

[[bin]]
name = "MarkdownAura-portable"
path = "src/main.rs"
